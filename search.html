<script>
(function () {
  // Data format: {"toolId": [name, brand, model, manualUrl]}
  var raw = JSON.parse(document.getElementById("nm-data").textContent);
  var m = Object.create(null);
  for (var k in raw) m[k.trim()] = raw[k];
  var input = document.getElementById("nm-id");
  var out = document.getElementById("nm-result");
  document.getElementById("nm-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var id = input.value.trim();
    var t = m[id];
    out.textContent = "";
    if (!t) {
      out.textContent = "Tool " + id + " was not found. Check the number and try again.";
      return;
    }
    var dl = document.createElement("dl");
    function add(label, value) {
      var dt = document.createElement("dt");
      dt.textContent = label;
      var dd = document.createElement("dd");
      dd.appendChild(typeof value === "string" ? document.createTextNode(value) : value);
      dl.appendChild(dt);
      dl.appendChild(dd);
    }
    var res = "None";
    try {
      var u = new URL(t[3]);
      if (/^https?:$/.test(u.protocol)) {
        res = document.createElement("a");
        res.href = t[3];
        res.target = "_blank";
        res.rel = "noopener noreferrer";
        res.textContent = "Open user manual on " + u.hostname.replace(/^www\./, "");
      }
    } catch (err) {}
    add("Tool ID", id);
    add("Name", t[0] || "None");
    add("Brand & Model", [t[1], t[2]].filter(Boolean).join(" ") || "None");
    add("Resources", res);
    out.appendChild(dl);
  });
})();
</script>

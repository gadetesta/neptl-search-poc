<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEPTL Tool Resource Search</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#5b6370;--line:#d8dce1;--row:#f4f6f8;--hover:#e3edf8;--link:#0b5cad;--btn:#f5c518;--btn-fg:#1f2328;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8eaed;--muted:#a3aab5;--line:#353a42;--row:#1e2126;--hover:#26313f;--link:#7cb4f0;--btn:#f5c518;--btn-fg:#16181c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#neptl-manuals{max-width:44rem;margin:0 auto;padding:1.5rem 1.25rem 3rem}
h1{font-size:1.4rem;margin:0 0 .25rem}
.nm-intro{margin:0 0 1.25rem;color:var(--muted);font-size:.95rem}
#nm-form{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
#nm-form label{flex-basis:100%;font-weight:600;font-size:.95rem}
#nm-id{width:6.5em;min-height:2.75rem;padding:.5rem .6rem;font-size:1.2rem;letter-spacing:.1em;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{min-height:2.75rem;padding:.5rem 1.1rem;font:inherit;font-weight:600;border:0;border-radius:6px;background:var(--btn);color:var(--btn-fg);cursor:pointer}
#nm-list-btn,.nm-pick{min-height:0;padding:.35rem 0;margin:-.35rem 0;background:none;color:var(--link);font-weight:600;text-decoration:underline;border-radius:0}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
a{color:var(--link)}
#nm-result:not(:empty){margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--line)}
.nm-name{font-size:1.5rem;line-height:1.2;margin:0 0 .25rem}
.nm-sub{color:var(--muted)}
.nm-tid{color:var(--muted);font-size:.875rem;font-variant-numeric:tabular-nums}
.nm-h3{font-size:1.05rem;margin:1.25rem 0 .25rem}
.nm-rows a{display:flex;align-items:center;gap:.9rem;min-height:3.75rem;padding:.5rem .125rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.nm-rows a>span{display:flex;flex-direction:column;flex-grow:1;min-width:0}
.nm-rows b{color:var(--link)}
.nm-rows small{color:var(--muted);font-size:.8125rem;overflow-wrap:anywhere}
.nm-rows svg{flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nm-rows .nm-ext{color:var(--muted)}
.nm-none{color:var(--muted);margin:.25rem 0 0}
#nm-list{margin-top:1.25rem;overflow-x:auto}
table{border-collapse:collapse;width:100%}
caption{text-align:left;color:var(--muted);padding-bottom:.5rem}
th,td{padding:.75rem .5rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{white-space:nowrap;font-size:.9rem;color:var(--muted);font-weight:600}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:var(--row)}
tbody tr:hover{background:var(--hover)}
.nm-idc{font-variant-numeric:tabular-nums;white-space:nowrap}
.nm-bm{display:block;font-size:.875rem;color:var(--muted)}
.nm-updated{margin:2rem 0 0;color:var(--muted);font-size:.8125rem}
.nm-cnt{white-space:nowrap;color:var(--muted);font-size:.875rem;text-align:right}
</style>
</head>

<script>
(function () {
  // Data format: {"toolId": [name, brand, model, [[type, label, url], ...]]}
  var raw = JSON.parse(document.getElementById("nm-data").textContent);
  var m = Object.create(null);
  for (var k in raw) m[k.trim()] = raw[k];
  var SVG = "http://www.w3.org/2000/svg";
  var ICONS = {
    "User Manual": ["M6 3h9l4 4v14H6z", "M15 3v4h4", "M9 12h7", "M9 16h7"],
    "Product Page": ["M3 5h18v14H3z", "M3 9h18", "M7 13h6", "M7 16h10"],
    "Repair Resource": ["M7 10h3v-3l-3.5-3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1-3 3l-6-6a6 6 0 0 1-8-8l3.5 3.5"],
    "Parts Diagram": ["M4 4h6v6H4z", "M14 14h6v6h-6z", "M10 10l4 4", "M14 4h6v6h-6z", "M14 10l-4 4", "M4 14h6v6H4z"],
    "Video": ["M3 7h12v10H3z", "M15 10.5l6-3v9l-6-3"],
    "Other": ["M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z", "M12 11v6", "M12 7.5v.5"],
    ext: ["M14 4h6v6", "M20 4l-9 9", "M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"]
  };
  var input = document.getElementById("nm-id");
  var form = document.getElementById("nm-form");
  var out = document.getElementById("nm-result");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    show(input.value.trim());
  });
  // Renders the result for one tool ID. Used by the search form and by list rows.
  function show(id) {
    var t = m[id];
    out.textContent = "";
    if (!t) {
      out.appendChild(el("p", "", "Tool " + id + " was not found. If that's a valid tool ID we may not be tracking it here (yet). Check back soon!"));
      return;
    }
    out.appendChild(el("h2", "nm-name", t[0] || "Unnamed tool"));
    var bm = brandModel(t);
    if (bm) out.appendChild(el("div", "nm-sub", bm));
    out.appendChild(el("div", "nm-tid", "Tool " + id));
    out.appendChild(el("h3", "nm-h3", "Resources"));
    var r = resources(t);
    if (!r.length) {
      out.appendChild(el("p", "nm-none", "No resources are available for this tool yet."));
      return;
    }
    var rows = el("div", "nm-rows", "");
    r.forEach(function (x) {
      var a = link(x);
      a.textContent = "";
      a.appendChild(icon(x.type, 22));
      var s = el("span", "", "");
      s.appendChild(el("b", "", x.label));
      s.appendChild(el("small", "", x.host));
      a.appendChild(s);
      var ext = icon("ext", 16);
      ext.setAttribute("class", "nm-ext");
      a.appendChild(ext);
      a.setAttribute("aria-label", x.label + ", " + x.host + ", opens in a new tab");
      rows.appendChild(a);
    });
    out.appendChild(rows);
  }
  var listBtn = document.getElementById("nm-list-btn");
  var list = document.getElementById("nm-list");
  // One click handler for the whole list: any click inside a row opens that tool.
  list.addEventListener("click", function (e) {
    var row = e.target.closest("tr[data-id]");
    if (!row) return;
    input.value = row.dataset.id;
    show(row.dataset.id);
    hideList();
    // The clicked button is gone now, so park keyboard focus on the list toggle.
    listBtn.focus({ preventScroll: true });
    form.scrollIntoView({ block: "start" });
  });
  function hideList() {
    list.textContent = "";
    listBtn.textContent = "see all tools with resources";
    listBtn.setAttribute("aria-expanded", "false");
  }
  listBtn.addEventListener("click", function () {
    if (list.firstChild) {
      hideList();
      return;
    }
    var ids = Object.keys(m).filter(function (k) { return resources(m[k]).length; });
    ids.sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
    var table = document.createElement("table");
    table.createCaption().textContent = ids.length + " tools with resources. Select a tool to see its resources.";
    var head = table.createTHead().insertRow();
    ["Tool ID", "Tool", "Resources"].forEach(function (h) {
      var th = document.createElement("th");
      th.scope = "col";
      th.textContent = h;
      head.appendChild(th);
    });
    head.lastChild.className = "nm-cnt";
    var body = table.createTBody();
    ids.forEach(function (k) {
      var t = m[k];
      var row = body.insertRow();
      row.dataset.id = k;
      var c = row.insertCell();
      c.className = "nm-idc";
      // The ID is a real button so keyboard and screen reader users can open the row too.
      var b = el("button", "nm-pick", k);
      b.type = "button";
      b.setAttribute("aria-label", "Show resources for tool " + k + ", " + (t[0] || "Unnamed tool"));
      c.appendChild(b);
      c = row.insertCell();
      c.appendChild(document.createTextNode(t[0] || "Unnamed tool"));
      var bm = brandModel(t);
      if (bm) c.appendChild(el("span", "nm-bm", bm));
      c = row.insertCell();
      c.className = "nm-cnt";
      c.textContent = resources(t).length;
    });
    list.appendChild(table);
    listBtn.textContent = "hide the list";
    listBtn.setAttribute("aria-expanded", "true");
  });
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }
  function brandModel(t) {
    return [t[1], t[2]].filter(Boolean).join(" ");
  }
  // Returns [{type, label, url, host}] for each valid http(s) resource.
  // Order and audience filtering are decided by the build script.
  function resources(t) {
    var r = [];
    t[3].forEach(function (x) {
      try {
        var u = new URL(x[2]);
        if (/^https?:$/.test(u.protocol)) r.push({ type: x[0], label: x[1], url: x[2], host: u.hostname.replace(/^www\./, "") });
      } catch (err) {}
    });
    return r;
  }
  function link(x) {
    var a = document.createElement("a");
    a.href = x.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = x.label;
    a.title = x.host;
    return a;
  }
  function icon(name, size) {
    var s = document.createElementNS(SVG, "svg");
    s.setAttribute("width", size);
    s.setAttribute("height", size);
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("aria-hidden", "true");
    (ICONS[name] || ICONS.Other).forEach(function (d) {
      var p = document.createElementNS(SVG, "path");
      p.setAttribute("d", d);
      s.appendChild(p);
    });
    return s;
  }
})();
</script>

<script>
(function () {
  var raw = JSON.parse(document.getElementById("nm-data").textContent);
  var m = Object.create(null);
  for (var k in raw) m[k.trim().toLowerCase()] = raw[k];
  var input = document.getElementById("nm-id");
  var out = document.getElementById("nm-result");
  document.getElementById("nm-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var typed = input.value.trim().replace(/^#/, "");
    var url = m[typed.toLowerCase()];
    var host = "";
    try {
      var u = new URL(url);
      if (/^https?:$/.test(u.protocol)) host = u.hostname.replace(/^www\./, "");
    } catch (err) {}
    out.textContent = "";
    if (host) {
      out.appendChild(document.createTextNode(typed + " - "));
      var a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "Open user manual on " + host;
      out.appendChild(a);
    } else {
      out.textContent = "We don't have a manual on file for tool " + typed + ". Please ask a volunteer for help.";
    }
  });
})();
</script>
